<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RAG Knowledge Assistant</title>
<style>
  :root {
    --bg: #f7f7f8;
    --border: #e2e2e5;
    --text: #1f2124;
    --muted: #6b7280;
    --user-bg: #2563eb;
    --user-text: #ffffff;
    --sources-bg: #f0f4ff;
    --sources-border: #c7d6fb;
    --error-bg: #fef2f2;
    --error-border: #fecaca;
    --error-text: #b91c1c;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }

  #app {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    height: calc(100vh - 48px);
  }

  header {
    margin-bottom: 16px;
  }

  header h1 {
    font-size: 1.25rem;
    margin: 0 0 4px;
  }

  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.875rem;
  }

  #historyEl {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 8px 4px;
  }

  .message {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .message-user {
    align-self: flex-end;
    background: var(--user-bg);
    color: var(--user-text);
    border-bottom-right-radius: 2px;
  }

  .message-assistant {
    align-self: flex-start;
    background: #ffffff;
    border: 1px solid var(--border);
    border-bottom-left-radius: 2px;
  }

  .message-loading {
    align-self: flex-start;
    color: var(--muted);
    font-style: italic;
  }

  .message-error {
    align-self: flex-start;
    background: var(--error-bg);
    border: 1px solid var(--error-border);
    color: var(--error-text);
  }

  .sources {
    margin-top: 8px;
    padding: 6px 10px;
    background: var(--sources-bg);
    border: 1px dashed var(--sources-border);
    border-radius: 8px;
    font-size: 0.8rem;
    color: var(--muted);
  }

  #ask-form {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }

  #question-input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 1rem;
  }

  #question-input:focus {
    outline: 2px solid var(--user-bg);
    outline-offset: 1px;
  }

  button[type="submit"] {
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    background: var(--user-bg);
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }

  button[type="submit"]:disabled {
    opacity: 0.6;
    cursor: default;
  }
</style>
</head>
<body>
  <div id="app">
    <header>
      <h1>RAG Knowledge Assistant</h1>
      <p>Задайте вопрос по внутренней базе знаний компании.</p>
    </header>

    <div id="historyEl"></div>

    <form id="ask-form">
      <input id="question-input" type="text" placeholder="Например: сколько дней отпуска положено сотруднику?" autocomplete="off" />
      <button type="submit">Отправить</button>
    </form>
  </div>

  <script>
    // Adjust if the API runs on a different host/port.
    const API_BASE_URL = "http://localhost:8000";

    const form = document.getElementById("ask-form");
    const input = document.getElementById("question-input");
    const historyEl = document.getElementById("historyEl");
    const submitButton = form.querySelector('button[type="submit"]');

    function appendMessage(text, className) {
      const el = document.createElement("div");
      el.className = `message ${className}`;
      el.textContent = text;
      historyEl.appendChild(el);
      historyEl.scrollTop = historyEl.scrollHeight;
      return el;
    }

    function appendAssistantMessage(answer, sourceDocuments) {
      const wrapper = document.createElement("div");
      wrapper.className = "message message-assistant";

      const answerEl = document.createElement("div");
      answerEl.textContent = answer;
      wrapper.appendChild(answerEl);

      if (sourceDocuments && sourceDocuments.length > 0) {
        const sourcesEl = document.createElement("div");
        sourcesEl.className = "sources";
        sourcesEl.textContent = `Источники: ${sourceDocuments.join(", ")}`;
        wrapper.appendChild(sourcesEl);
      }

      historyEl.appendChild(wrapper);
      historyEl.scrollTop = historyEl.scrollHeight;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const question = input.value.trim();
      if (!question) {
        return;
      }

      appendMessage(question, "message-user");
      input.value = "";
      input.disabled = true;
      submitButton.disabled = true;

      const loadingEl = appendMessage("Думаю...", "message-loading");

      try {
        const response = await fetch(`${API_BASE_URL}/ask`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });

        loadingEl.remove();

        const body = await response.json().catch(() => null);

        if (!response.ok) {
          const detail = body && body.detail ? body.detail : `Ошибка ${response.status}`;
          appendMessage(detail, "message-error");
          return;
        }

        appendAssistantMessage(body.answer, body.source_documents);
      } catch (err) {
        loadingEl.remove();
        appendMessage(`Не удалось связаться с сервером: ${err.message}`, "message-error");
      } finally {
        input.disabled = false;
        submitButton.disabled = false;
        input.focus();
      }
    });

    input.focus();
  </script>
</body>
</html>
