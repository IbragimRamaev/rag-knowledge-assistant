name: rag-knowledge-assistant

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Postgres's own entrypoint runs every *.sql here, but only while initializing
      # a brand-new (empty) data directory - a no-op on every subsequent start, and
      # it won't pick up later schema.sql edits on an existing volume.
      - ../app/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rag_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      # Context stays the repo root (one level up from this file) - the Dockerfile
      # COPYs app/ and data/ from there, and .dockerignore must live at the context
      # root too (Docker doesn't support locating it anywhere else).
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rag-app
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # Overrides the .env value (which points at localhost for local, non-Docker
      # runs) - inside the compose network the DB is reachable by service name.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-rag_db}
    ports:
      - "8000:8000"
    volumes:
      # Dev convenience: host code overlays the image's copy so edits show up without
      # a rebuild. The Dockerfile's own CMD (no --reload) stays what a prod image runs.
      - ../app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      # No curl in python:3.12-slim - python itself is always present, so it
      # doubles as the HTTP client. A non-2xx/unreachable raises and fails the check.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
