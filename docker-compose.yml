services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rag_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: rag-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides the .env value (which points at localhost for local, non-Docker
      # runs) - inside the compose network the DB is reachable by service name.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-rag_db}
    ports:
      - "8000:8000"
    volumes:
      # Dev convenience: host code overlays the image's copy so edits show up without
      # a rebuild. The Dockerfile's own CMD (no --reload) stays what a prod image runs.
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # TODO(backlog): add an HTTP healthcheck here, same idea as postgres's
    # pg_isready above (e.g. `curl -f localhost:8000/docs` or a dedicated
    # /health endpoint). Caught in the wild: after a WSL/Docker restart, the
    # uvicorn --reload watcher failed its initial import and sat there dead
    # without exiting - `docker compose ps` kept reporting "Up" the whole
    # time. `restart: unless-stopped` only reacts to the container process
    # actually exiting, not to a hung-but-alive one; a healthcheck would
    # have caught this and let compose restart it automatically.
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
